<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FraudShield — Verify OTP</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #050810; --surface: #0d1117; --border: #1e2a3a; --accent: #3b82f6; --text: #e2e8f0; --muted: #64748b; --card: #0a0f1a; }
  body { font-family: 'Space Grotesk', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .bg-grid { position: fixed; inset: 0; z-index: 0; background-image: linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px); background-size: 40px 40px; }
  .card { position: relative; z-index: 10; width: 440px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 48px; box-shadow: 0 32px 64px rgba(0,0,0,0.5); animation: slideUp 0.6s cubic-bezier(.16,1,.3,1) both; text-align: center; }
  @keyframes slideUp { from { opacity:0; transform: translateY(24px); } to { opacity:1; transform: translateY(0); } }

  .icon { font-size: 52px; margin-bottom: 20px; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .email-badge { display: inline-block; background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.2); color: var(--accent); padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 32px; }

  .otp-inputs { display: flex; gap: 12px; justify-content: center; margin-bottom: 28px; }
  .otp-inputs input {
    width: 52px; height: 60px;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px; font-weight: 700;
    text-align: center;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.1s;
  }
  .otp-inputs input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); transform: translateY(-2px); }
  .otp-inputs input.filled { border-color: rgba(59,130,246,0.5); background: rgba(59,130,246,0.06); }

  .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #3b82f6, #6366f1); color: #fff; border: none; border-radius: 10px; font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
  .btn:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.5; }
  .spinner { display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .resend-row { margin-top: 20px; color: var(--muted); font-size: 14px; }
  .resend-btn { background: none; border: none; color: var(--accent); font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
  .resend-btn:disabled { color: var(--muted); cursor: not-allowed; }

  .timer { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .toast { display: none; padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; font-weight: 500; }
  .toast.error { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; display: block; }
  .toast.success { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7; display: block; }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="card">
  <div class="icon">📬</div>
  <h1>Check your inbox</h1>
  <p class="subtitle">We sent a 6-digit code to</p>
  <div class="email-badge" id="emailBadge">loading...</div>

  <div id="toast" class="toast"></div>

  <div class="otp-inputs">
    <input type="text" maxlength="1" class="otp-digit" oninput="handleInput(this,0)" onkeydown="handleKey(this,0)">
    <input type="text" maxlength="1" class="otp-digit" oninput="handleInput(this,1)" onkeydown="handleKey(this,1)">
    <input type="text" maxlength="1" class="otp-digit" oninput="handleInput(this,2)" onkeydown="handleKey(this,2)">
    <input type="text" maxlength="1" class="otp-digit" oninput="handleInput(this,3)" onkeydown="handleKey(this,3)">
    <input type="text" maxlength="1" class="otp-digit" oninput="handleInput(this,4)" onkeydown="handleKey(this,4)">
    <input type="text" maxlength="1" class="otp-digit" oninput="handleInput(this,5)" onkeydown="handleKey(this,5)">
  </div>

  <button class="btn" id="verifyBtn" onclick="doVerify()">
    <span id="btnText">Verify Code</span>
    <div class="spinner" id="spinner"></div>
  </button>

  <div class="resend-row">
    Didn't receive it?
    <button class="resend-btn" id="resendBtn" onclick="doResend()" disabled>Resend OTP</button>
  </div>
  <div class="timer" id="timer">Resend available in <strong id="countdown">60</strong>s</div>
</div>

<script>
const digits = document.querySelectorAll('.otp-digit');
const email = localStorage.getItem('pending_email') || '';
const purpose = localStorage.getItem('otp_purpose') || 'verify';
document.getElementById('emailBadge').textContent = email || 'your email';

function handleInput(el, idx) {
  el.value = el.value.replace(/\D/g, '');
  el.classList.toggle('filled', el.value !== '');
  if (el.value && idx < 5) digits[idx + 1].focus();
  if (getOTP().length === 6) doVerify();
}
function handleKey(el, idx) {
  if (event.key === 'Backspace' && !el.value && idx > 0) digits[idx - 1].focus();
}
function getOTP() { return [...digits].map(d => d.value).join(''); }

async function doVerify() {
  const otp = getOTP();
  if (otp.length < 6) return showToast('Enter all 6 digits', 'error');
  setLoading(true);
  try {
    const endpoint = purpose === 'reset' ? '/api/auth/verify-otp' : '/api/auth/verify-otp';
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, otp, purpose })
    });
    const data = await res.json();
    if (!res.ok) {
      digits.forEach(d => { d.value = ''; d.classList.remove('filled'); });
      digits[0].focus();
      return showToast(data.detail || 'Invalid OTP', 'error');
    }
    showToast('Verified! Redirecting...', 'success');
    setTimeout(() => {
      if (purpose === 'reset') {
        window.location.href = '/forgot-password?step=reset';
      } else {
        window.location.href = '/login';
      }
    }, 1200);
  } catch (e) {
    showToast('Network error', 'error');
  } finally {
    setLoading(false);
  }
}

async function doResend() {
  document.getElementById('resendBtn').disabled = true;
  try {
    await fetch('/api/auth/resend-otp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    showToast('New OTP sent! Check your email (or server console in dev mode).', 'success');
    startTimer();
  } catch (e) { showToast('Failed to resend', 'error'); }
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type;
}
function setLoading(v) {
  document.getElementById('verifyBtn').disabled = v;
  document.getElementById('btnText').style.display = v ? 'none' : 'block';
  document.getElementById('spinner').style.display = v ? 'block' : 'none';
}

let timerVal = 60;
function startTimer() {
  timerVal = 60;
  document.getElementById('timer').style.display = 'block';
  document.getElementById('resendBtn').disabled = true;
  const iv = setInterval(() => {
    timerVal--;
    document.getElementById('countdown').textContent = timerVal;
    if (timerVal <= 0) {
      clearInterval(iv);
      document.getElementById('resendBtn').disabled = false;
      document.getElementById('timer').style.display = 'none';
    }
  }, 1000);
}
startTimer();
digits[0].focus();
</script>
</body>
</html>
