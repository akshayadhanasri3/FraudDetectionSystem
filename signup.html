<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FraudShield — Create Account</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #050810; --surface: #0d1117; --border: #1e2a3a;
    --accent: #3b82f6; --accent2: #6366f1;
    --text: #e2e8f0; --muted: #64748b; --card: #0a0f1a;
    --success: #10b981; --danger: #ef4444;
  }
  body { font-family: 'Space Grotesk', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .bg-grid { position: fixed; inset: 0; z-index: 0; background-image: linear-gradient(rgba(99,102,241,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(99,102,241,0.04) 1px, transparent 1px); background-size: 40px 40px; }
  .bg-glow { position: fixed; z-index: 0; width: 500px; height: 500px; border-radius: 50%; filter: blur(120px); opacity: 0.12; }
  .bg-glow.a { background: #6366f1; top: -150px; right: -100px; }
  .bg-glow.b { background: #3b82f6; bottom: -150px; left: -100px; }

  .card { position: relative; z-index: 10; width: 460px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 44px 48px; box-shadow: 0 0 0 1px rgba(99,102,241,0.08), 0 32px 64px rgba(0,0,0,0.5); animation: slideUp 0.6s cubic-bezier(.16,1,.3,1) both; }
  @keyframes slideUp { from { opacity:0; transform: translateY(24px); } to { opacity:1; transform: translateY(0); } }

  .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, #3b82f6, #6366f1); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .logo-text { font-size: 20px; font-weight: 700; }
  .logo-text span { color: var(--accent); }

  h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  .field { margin-bottom: 18px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 7px; letter-spacing: 0.5px; text-transform: uppercase; }
  input { width: 100%; padding: 13px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 15px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
  input:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(99,102,241,0.12); }
  input::placeholder { color: var(--muted); }

  .strength-bar { height: 4px; border-radius: 2px; background: var(--border); margin-top: 8px; overflow: hidden; }
  .strength-fill { height: 100%; border-radius: 2px; transition: width 0.3s, background 0.3s; width: 0; }

  .btn { width: 100%; padding: 13px; background: linear-gradient(135deg, #3b82f6, #6366f1); color: #fff; border: none; border-radius: 10px; font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px; transition: opacity 0.2s, transform 0.1s; }
  .btn:hover { opacity: 0.9; }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .spinner { display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .link-row { text-align: center; color: var(--muted); font-size: 14px; margin-top: 20px; }
  .link-row a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .toast { display: none; padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 18px; font-weight: 500; }
  .toast.error { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; display: block; }
  .toast.success { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7; display: block; }

  .terms { font-size: 12px; color: var(--muted); text-align: center; margin-top: 16px; }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow a"></div>
<div class="bg-glow b"></div>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🛡️</div>
    <div class="logo-text">Fraud<span>Shield</span></div>
  </div>
  <h1>Create your account</h1>
  <p class="subtitle">Start protecting your transactions today</p>

  <div id="toast" class="toast"></div>

  <div class="field">
    <label>Username</label>
    <input type="text" id="username" placeholder="johndoe" autocomplete="username">
  </div>
  <div class="field">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="you@example.com">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="Min. 8 characters" oninput="checkStrength(this.value)">
    <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
  </div>
  <div class="field">
    <label>Confirm Password</label>
    <input type="password" id="confirm" placeholder="Repeat password">
  </div>

  <button class="btn" id="regBtn" onclick="doRegister()">
    <span id="btnText">Create Account</span>
    <div class="spinner" id="spinner"></div>
  </button>

  <p class="terms">By creating an account, you agree to our Terms of Service.</p>

  <div class="link-row">
    Already have an account? <a href="/login">Sign in</a>
  </div>
</div>

<script>
function checkStrength(pw) {
  let score = 0;
  if (pw.length >= 8) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  const fill = document.getElementById('strengthFill');
  const colors = ['#ef4444', '#f97316', '#eab308', '#10b981'];
  fill.style.width = (score * 25) + '%';
  fill.style.background = colors[score - 1] || '#1e2a3a';
}

async function doRegister() {
  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;

  if (!username || !email || !password) return showToast('Please fill in all fields', 'error');
  if (password !== confirm) return showToast('Passwords do not match', 'error');
  if (password.length < 8) return showToast('Password must be at least 8 characters', 'error');

  setLoading(true);
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password })
    });
    const data = await res.json();
    if (!res.ok) return showToast(data.detail || 'Registration failed', 'error');
    showToast('Account created! Redirecting to verify your email...', 'success');
    localStorage.setItem('pending_email', email);
    localStorage.setItem('otp_purpose', 'verify');
    setTimeout(() => window.location.href = '/verify-otp', 1500);
  } catch (e) {
    showToast('Network error. Is the server running?', 'error');
  } finally {
    setLoading(false);
  }
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type;
}
function setLoading(v) {
  document.getElementById('regBtn').disabled = v;
  document.getElementById('btnText').style.display = v ? 'none' : 'block';
  document.getElementById('spinner').style.display = v ? 'block' : 'none';
}
</script>
</body>
</html>
