<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FraudShield — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #050810; --surface: #0d1117; --border: #1e2a3a; --accent: #3b82f6; --text: #e2e8f0; --muted: #64748b; --card: #0a0f1a; --danger: #ef4444; }
  body { font-family: 'Space Grotesk', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .bg-grid { position: fixed; inset: 0; z-index: 0; background-image: linear-gradient(rgba(239,68,68,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(239,68,68,0.03) 1px, transparent 1px); background-size: 40px 40px; }
  .bg-glow { position: fixed; z-index: 0; width: 400px; height: 400px; border-radius: 50%; filter: blur(120px); opacity: 0.1; background: #ef4444; top: -100px; left: 50%; transform: translateX(-50%); }

  .card { position: relative; z-index: 10; width: 440px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 48px; box-shadow: 0 32px 64px rgba(0,0,0,0.5); animation: slideUp 0.6s cubic-bezier(.16,1,.3,1) both; }
  @keyframes slideUp { from { opacity:0; transform: translateY(24px); } to { opacity:1; transform: translateY(0); } }

  .step { display: none; }
  .step.active { display: block; }

  .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, #ef4444, #f97316); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .logo-text { font-size: 20px; font-weight: 700; }
  .logo-text span { color: var(--danger); }
  .icon-big { font-size: 48px; text-align: center; margin-bottom: 16px; }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 28px; }

  .field { margin-bottom: 18px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 7px; letter-spacing: 0.5px; text-transform: uppercase; }
  input { width: 100%; padding: 13px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 15px; outline: none; transition: border-color 0.2s; }
  input:focus { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(239,68,68,0.1); }
  input::placeholder { color: var(--muted); }

  .otp-inputs { display: flex; gap: 10px; justify-content: center; margin-bottom: 24px; }
  .otp-inputs input { width: 48px; height: 56px; font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; text-align: center; border-radius: 10px; padding: 0; }
  .otp-inputs input:focus { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(239,68,68,0.1); }

  .btn { width: 100%; padding: 13px; background: linear-gradient(135deg, #ef4444, #f97316); color: #fff; border: none; border-radius: 10px; font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
  .btn:hover { opacity: 0.9; }
  .btn:disabled { opacity: 0.5; }
  .spinner { display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .back-link { display: block; text-align: center; margin-top: 20px; color: var(--muted); font-size: 14px; }
  .back-link a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .toast { display: none; padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 18px; font-weight: 500; }
  .toast.error { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; display: block; }
  .toast.success { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7; display: block; }

  .strength-bar { height: 4px; border-radius: 2px; background: var(--border); margin-top: 8px; }
  .strength-fill { height: 100%; border-radius: 2px; transition: width 0.3s, background 0.3s; width: 0; }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🔑</div>
    <div class="logo-text">Fraud<span>Shield</span></div>
  </div>

  <!-- Step 1: Email -->
  <div class="step active" id="step1">
    <div class="icon-big">🔐</div>
    <h1>Forgot password?</h1>
    <p class="subtitle">Enter your email and we'll send a reset code</p>
    <div id="toast1" class="toast"></div>
    <div class="field">
      <label>Email Address</label>
      <input type="email" id="resetEmail" placeholder="you@example.com">
    </div>
    <button class="btn" id="sendBtn" onclick="sendOTP()">
      <span id="sendText">Send Reset Code</span>
      <div class="spinner" id="sendSpinner"></div>
    </button>
    <div class="back-link"><a href="/login">← Back to login</a></div>
  </div>

  <!-- Step 2: OTP -->
  <div class="step" id="step2">
    <div class="icon-big">📨</div>
    <h1>Enter reset code</h1>
    <p class="subtitle">We sent a 6-digit code to your email</p>
    <div id="toast2" class="toast"></div>
    <div class="otp-inputs">
      <input type="text" maxlength="1" class="r-digit" oninput="rInput(this,0)" onkeydown="rKey(this,0)">
      <input type="text" maxlength="1" class="r-digit" oninput="rInput(this,1)" onkeydown="rKey(this,1)">
      <input type="text" maxlength="1" class="r-digit" oninput="rInput(this,2)" onkeydown="rKey(this,2)">
      <input type="text" maxlength="1" class="r-digit" oninput="rInput(this,3)" onkeydown="rKey(this,3)">
      <input type="text" maxlength="1" class="r-digit" oninput="rInput(this,4)" onkeydown="rKey(this,4)">
      <input type="text" maxlength="1" class="r-digit" oninput="rInput(this,5)" onkeydown="rKey(this,5)">
    </div>
    <button class="btn" id="verifyBtn" onclick="verifyResetOTP()">
      <span id="verifyText">Verify Code</span>
      <div class="spinner" id="verifySpinner"></div>
    </button>
  </div>

  <!-- Step 3: New Password -->
  <div class="step" id="step3">
    <div class="icon-big">🔒</div>
    <h1>Set new password</h1>
    <p class="subtitle">Choose a strong password for your account</p>
    <div id="toast3" class="toast"></div>
    <div class="field">
      <label>New Password</label>
      <input type="password" id="newPw" placeholder="Min. 8 characters" oninput="checkStr(this.value)">
      <div class="strength-bar"><div class="strength-fill" id="strFill"></div></div>
    </div>
    <div class="field">
      <label>Confirm New Password</label>
      <input type="password" id="confirmPw" placeholder="Repeat password">
    </div>
    <button class="btn" id="resetBtn" onclick="doReset()">
      <span id="resetText">Reset Password</span>
      <div class="spinner" id="resetSpinner"></div>
    </button>
  </div>
</div>

<script>
const digits = document.querySelectorAll('.r-digit');
let savedEmail = '', savedOTP = '';

function showStep(n) {
  document.querySelectorAll('.step').forEach((s,i) => s.classList.toggle('active', i === n-1));
}
function toast(id, msg, type) {
  const t = document.getElementById('toast'+id);
  t.textContent = msg; t.className = 'toast '+type;
}

async function sendOTP() {
  savedEmail = document.getElementById('resetEmail').value.trim();
  if (!savedEmail) return toast(1, 'Enter your email', 'error');
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('sendText').style.display = 'none';
  document.getElementById('sendSpinner').style.display = 'block';
  try {
    const res = await fetch('/api/auth/forgot-password', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email: savedEmail })
    });
    const data = await res.json();
    toast(1, data.message, 'success');
    setTimeout(() => showStep(2), 1200);
  } catch(e) { toast(1,'Network error','error'); }
  finally {
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('sendText').style.display = 'block';
    document.getElementById('sendSpinner').style.display = 'none';
  }
}

function rInput(el, idx) {
  el.value = el.value.replace(/\D/g,'');
  if (el.value && idx < 5) digits[idx+1].focus();
}
function rKey(el, idx) {
  if (event.key === 'Backspace' && !el.value && idx > 0) digits[idx-1].focus();
}

async function verifyResetOTP() {
  savedOTP = [...digits].map(d=>d.value).join('');
  if (savedOTP.length < 6) return toast(2,'Enter all 6 digits','error');
  document.getElementById('verifyBtn').disabled = true;
  document.getElementById('verifyText').style.display = 'none';
  document.getElementById('verifySpinner').style.display = 'block';
  try {
    const res = await fetch('/api/auth/verify-otp', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email: savedEmail, otp: savedOTP, purpose: 'reset' })
    });
    const data = await res.json();
    if (!res.ok) return toast(2, data.detail || 'Invalid OTP','error');
    toast(2,'Code verified!','success');
    setTimeout(() => showStep(3), 1000);
  } catch(e) { toast(2,'Network error','error'); }
  finally {
    document.getElementById('verifyBtn').disabled = false;
    document.getElementById('verifyText').style.display = 'block';
    document.getElementById('verifySpinner').style.display = 'none';
  }
}

function checkStr(pw) {
  let s=0;
  if(pw.length>=8)s++; if(/[A-Z]/.test(pw))s++; if(/[0-9]/.test(pw))s++; if(/[^A-Za-z0-9]/.test(pw))s++;
  const f=document.getElementById('strFill');
  f.style.width=(s*25)+'%';
  f.style.background=['#ef4444','#f97316','#eab308','#10b981'][s-1]||'#1e2a3a';
}

async function doReset() {
  const pw = document.getElementById('newPw').value;
  const cpw = document.getElementById('confirmPw').value;
  if (!pw) return toast(3,'Enter new password','error');
  if (pw !== cpw) return toast(3,'Passwords do not match','error');
  if (pw.length < 8) return toast(3,'Minimum 8 characters','error');
  document.getElementById('resetBtn').disabled = true;
  document.getElementById('resetText').style.display = 'none';
  document.getElementById('resetSpinner').style.display = 'block';
  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email: savedEmail, otp: savedOTP, new_password: pw })
    });
    const data = await res.json();
    if (!res.ok) return toast(3, data.detail || 'Reset failed','error');
    toast(3,'Password reset! Redirecting to login...','success');
    setTimeout(() => window.location.href = '/login', 1500);
  } catch(e) { toast(3,'Network error','error'); }
  finally {
    document.getElementById('resetBtn').disabled = false;
    document.getElementById('resetText').style.display = 'block';
    document.getElementById('resetSpinner').style.display = 'none';
  }
}

// Check if coming from OTP verify redirect
if (new URLSearchParams(window.location.search).get('step') === 'reset') {
  savedEmail = localStorage.getItem('pending_email') || '';
  showStep(3);
}
</script>
</body>
</html>
